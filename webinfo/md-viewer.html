<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MD Viewer</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0a0e1a;
            color: #a8b2d1;
            padding: 20px;
            margin: 0;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #141929;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        
        h1, h2, h3, h4 {
            color: #00d4ff;
            border-bottom: 1px solid #2a3244;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        
        h1 {
            font-size: 2em;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
        }
        
        h2 {
            font-size: 1.5em;
            margin-top: 30px;
        }
        
        h3 {
            font-size: 1.2em;
            color: #667eea;
        }
        
        p {
            margin-bottom: 15px;
            color: #a8b2d1;
        }
        
        strong {
            color: #fff;
        }
        
        ul, ol {
            margin-bottom: 20px;
            padding-left: 30px;
        }
        
        li {
            margin-bottom: 8px;
            color: #a8b2d1;
        }
        
        code {
            background: #1e2333;
            padding: 2px 6px;
            border-radius: 4px;
            color: #00d4ff;
            font-family: 'Consolas', 'Monaco', monospace;
        }
        
        pre {
            background: #1e2333;
            border: 1px solid #2a3244;
            border-radius: 8px;
            padding: 15px;
            overflow-x: auto;
            margin-bottom: 20px;
        }
        
        blockquote {
            border-left: 4px solid #00d4ff;
            padding-left: 20px;
            margin: 20px 0;
            background: rgba(0, 212, 255, 0.05);
            border-radius: 0 8px 8px 0;
            padding: 15px 20px;
        }
        
        a {
            color: #00d4ff;
            text-decoration: none;
            transition: all 0.3s;
        }
        
        a:hover {
            color: #667eea;
            text-shadow: 0 0 10px rgba(102, 126, 234, 0.5);
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        
        th, td {
            border: 1px solid #2a3244;
            padding: 10px;
            text-align: left;
        }
        
        th {
            background: #1e2333;
            color: #00d4ff;
        }
        
        tr:nth-child(even) {
            background: rgba(30, 35, 51, 0.5);
        }
        
        .loading {
            text-align: center;
            padding: 50px;
            color: #64748b;
        }
        
        .error {
            background: rgba(255, 0, 0, 0.1);
            border: 1px solid #ff0000;
            color: #ff6b6b;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }
        
        #content {
            animation: fadeIn 0.5s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="md-content.js"></script>
</head>
<body>
    <div class="container">
        <div id="content" class="loading">Загрузка MD файла...</div>
    </div>
    
    <script>
        // Получаем имя файла из параметров URL
        const urlParams = new URLSearchParams(window.location.search);
        const mdFile = urlParams.get('file');
        
        if (mdFile) {
            // Используем встроенный контент из md-content.js
            if (typeof mdContent !== 'undefined' && mdContent[mdFile]) {
                const html = marked.parse(mdContent[mdFile]);
                document.getElementById('content').innerHTML = html;
            } else {
                document.getElementById('content').innerHTML = `
                    <div class="error">
                        <h2>Файл не найден во встроенном контенте</h2>
                        <p>Файл: ${mdFile}</p>
                        <p>Доступные файлы: ${typeof mdContent !== 'undefined' ? Object.keys(mdContent).join(', ') : 'mdContent не загружен'}</p>
                    </div>
                `;
            }
        } else {
            document.getElementById('content').innerHTML = `
                <div class="error">
                    <h2>Файл не указан</h2>
                    <p>Необходимо указать параметр file в URL</p>
                </div>
            `;
        }
    </script>
</body>
</html>
