<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jury Network - Hi-Tech Visualization</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0e1a;
            --bg-secondary: #141929;
            --bg-tertiary: #1e2333;
            --accent-blue: #00d4ff;
            --accent-cyan: #00a8cc;
            --accent-dark: #005f7f;
            --text-primary: #ffffff;
            --text-secondary: #a8b2d1;
            --text-dim: #64748b;
            --border-color: #2a3244;
            --metallic: linear-gradient(135deg, #667eea 0%, #00d4ff 100%);
            --metallic-dark: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow: hidden;
            height: 100vh;
        }

        /* Header */
        .header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 0;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            box-shadow: 0 2px 20px rgba(0, 212, 255, 0.1);
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 30px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: var(--metallic);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
        }

        .logo-text {
            font-size: 20px;
            font-weight: 700;
            background: var(--metallic);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .nav-tabs {
            display: flex;
            gap: 0;
            background: var(--bg-tertiary);
            border-radius: 10px;
            padding: 4px;
        }

        .nav-tab {
            padding: 10px 30px;
            background: transparent;
            color: var(--text-secondary);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .nav-tab:hover {
            color: var(--accent-blue);
        }

        .nav-tab.active {
            background: var(--metallic);
            color: var(--text-primary);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
        }

        /* Main Content */
        .main-container {
            margin-top: 70px;
            height: calc(100vh - 70px);
            position: relative;
        }

        .tab-content {
            display: none;
            height: 100%;
        }

        .tab-content.active {
            display: block;
        }

        /* Graph View Styles */
        #graph-view {
            position: relative;
            height: 100%;
            background: radial-gradient(circle at center, var(--bg-secondary) 0%, var(--bg-primary) 100%);
        }

        #graph-svg {
            width: 100%;
            height: 100%;
        }

        .graph-controls {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(20, 25, 41, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            min-width: 280px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .graph-controls h3 {
            color: var(--accent-blue);
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        .search-box {
            width: 100%;
            padding: 10px 15px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 14px;
            margin-bottom: 15px;
            transition: all 0.3s;
        }

        .search-box:focus {
            outline: none;
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.1);
        }

        .search-box::placeholder {
            color: var(--text-dim);
        }

        .filter-section {
            margin-bottom: 15px;
        }

        .filter-title {
            color: var(--text-secondary);
            font-size: 12px;
            text-transform: uppercase;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .checkbox-item:hover {
            background: rgba(0, 212, 255, 0.05);
        }

        .checkbox-item input[type="checkbox"] {
            appearance: none;
            width: 18px;
            height: 18px;
            border: 2px solid var(--border-color);
            border-radius: 4px;
            margin-right: 10px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }

        .checkbox-item input[type="checkbox"]:checked {
            background: var(--accent-blue);
            border-color: var(--accent-blue);
        }

        .checkbox-item input[type="checkbox"]:checked::after {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--bg-primary);
            font-size: 12px;
            font-weight: bold;
        }

        .checkbox-item label {
            color: var(--text-secondary);
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .color-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            box-shadow: 0 0 10px currentColor;
        }

        /* Stats Panel */
        .stats-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(20, 25, 41, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: var(--accent-blue);
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
        }

        .stat-label {
            font-size: 11px;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 5px;
        }

        /* Zoom Controls */
        .zoom-controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .zoom-btn {
            width: 40px;
            height: 40px;
            background: rgba(20, 25, 41, 0.95);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.3s;
        }

        .zoom-btn:hover {
            background: var(--accent-dark);
            color: var(--accent-blue);
            border-color: var(--accent-blue);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
        }

        /* Info Panel */
        .info-panel {
            position: fixed;
            right: -450px;
            top: 70px;
            width: 450px;
            height: calc(100vh - 70px);
            background: var(--bg-secondary);
            border-left: 1px solid var(--accent-blue);
            transition: right 0.3s ease;
            overflow-y: auto;
            z-index: 999;
            box-shadow: -5px 0 30px rgba(0, 0, 0, 0.5);
        }

        .info-panel.show {
            right: 0;
        }

        .info-panel-header {
            padding: 20px;
            background: var(--bg-tertiary);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .info-panel-close {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 30px;
            height: 30px;
            background: transparent;
            border: 1px solid var(--border-color);
            border-radius: 50%;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            font-size: 20px;
        }

        .info-panel-close:hover {
            background: var(--accent-dark);
            color: var(--accent-blue);
            border-color: var(--accent-blue);
        }

        .info-panel-content {
            padding: 20px;
        }

        /* Personalities View */
        #personalities-view {
            display: flex;
            height: 100%;
            background: var(--bg-primary);
        }

        .personalities-sidebar {
            width: 350px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            overflow-y: auto;
            padding: 20px;
        }

        .personalities-sidebar h2 {
            color: var(--accent-blue);
            font-size: 18px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
        }

        .person-card {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .person-card:hover {
            border-color: var(--accent-dark);
            transform: translateX(5px);
            box-shadow: 0 5px 20px rgba(0, 212, 255, 0.1);
        }

        .person-card.active {
            background: var(--metallic-dark);
            border-color: var(--accent-blue);
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.3);
        }

        .person-name {
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 5px;
        }

        .person-position {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 3px;
        }

        .person-company {
            font-size: 12px;
            color: var(--text-dim);
        }

        .person-category {
            display: inline-block;
            padding: 3px 8px;
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid var(--accent-dark);
            border-radius: 12px;
            font-size: 10px;
            color: var(--accent-blue);
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .personalities-detail {
            flex: 1;
            background: var(--bg-primary);
            overflow-y: auto;
            padding: 30px;
        }

        .detail-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-dim);
        }

        .detail-placeholder-icon {
            font-size: 64px;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        .detail-placeholder h3 {
            font-size: 20px;
            margin-bottom: 10px;
        }

        /* Tooltip */
        .tooltip {
            position: absolute;
            background: rgba(20, 25, 41, 0.98);
            border: 1px solid var(--accent-blue);
            border-radius: 8px;
            padding: 12px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            font-size: 13px;
            z-index: 2000;
            max-width: 280px;
            box-shadow: 0 8px 32px rgba(0, 212, 255, 0.2);
        }

        .tooltip.show {
            opacity: 1;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-dark);
        }

        /* Animations */
        @keyframes pulse {
            0%, 100% { 
                box-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
            }
            50% { 
                box-shadow: 0 0 40px rgba(0, 212, 255, 0.8);
            }
        }

        .pulse-animation {
            animation: pulse 2s infinite;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in {
            animation: fadeIn 0.3s ease;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <div class="logo-icon">🔬</div>
                <div class="logo-text">Jury Network</div>
            </div>
            <nav class="nav-tabs">
                <button class="nav-tab active" onclick="switchTab('graph')">Граф знаний</button>
                <button class="nav-tab" onclick="switchTab('personalities')">Personalities</button>
            </nav>
            <div style="width: 40px;"></div>
        </div>
    </header>

    <main class="main-container">
        <!-- Graph View -->
        <div id="graph-view" class="tab-content active">
            <div class="graph-controls">
                <h3>Управление графом</h3>
                <input type="text" class="search-box" id="graphSearch" placeholder="Поиск по графу...">
                
                <div class="filter-section">
                    <div class="filter-title">Типы узлов</div>
                    <div class="checkbox-group">
                        <div class="checkbox-item">
                            <input type="checkbox" id="filter-person" checked>
                            <label for="filter-person">
                                <span class="color-indicator" style="color: #00d4ff"></span>
                                Люди
                            </label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="filter-company" checked>
                            <label for="filter-company">
                                <span class="color-indicator" style="color: #00a8cc"></span>
                                Компании
                            </label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="filter-investor" checked>
                            <label for="filter-investor">
                                <span class="color-indicator" style="color: #667eea"></span>
                                Инвесторы
                            </label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="filter-skill" checked>
                            <label for="filter-skill">
                                <span class="color-indicator" style="color: #64748b"></span>
                                Навыки
                            </label>
                        </div>
                    </div>
                </div>
            </div>

            <div class="stats-panel">
                <div class="stats-grid">
                    <div class="stat-item">
                        <div class="stat-value" id="nodeCount">0</div>
                        <div class="stat-label">Узлов</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="linkCount">0</div>
                        <div class="stat-label">Связей</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value">14</div>
                        <div class="stat-label">Персон</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="companyCount">0</div>
                        <div class="stat-label">Компаний</div>
                    </div>
                </div>
            </div>

            <div class="zoom-controls">
                <button class="zoom-btn" onclick="zoomIn()">+</button>
                <button class="zoom-btn" onclick="zoomOut()">−</button>
                <button class="zoom-btn" onclick="resetZoom()">⟲</button>
            </div>

            <svg id="graph-svg"></svg>
        </div>

        <!-- Personalities View -->
        <div id="personalities-view" class="tab-content">
            <aside class="personalities-sidebar">
                <h2>Члены жюри</h2>
                <input type="text" class="search-box" id="personSearch" placeholder="Поиск персоны...">
                <div id="personList"></div>
            </aside>
            <main class="personalities-detail">
                <div id="personDetail">
                    <div class="detail-placeholder">
                        <div class="detail-placeholder-icon">👤</div>
                        <h3>Выберите члена жюри</h3>
                        <p>Для просмотра детальной информации</p>
                    </div>
                </div>
            </main>
        </div>
    </main>

    <div class="info-panel" id="infoPanel">
        <div class="info-panel-header">
            <button class="info-panel-close" onclick="closeInfoPanel()">×</button>
            <div id="infoPanelTitle"></div>
        </div>
        <div class="info-panel-content" id="infoPanelContent"></div>
    </div>

    <div class="tooltip" id="tooltip"></div>

    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="data/persons.js"></script>
    <script src="data/companies.js"></script>
    <script src="data/investors.js"></script>
    <script src="data/connections.js"></script>
    <script src="graph-data.js"></script>
    <script src="app.js"></script>
</body>
</html>
